name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: QA baseline
        run: node scripts/qa-baseline.mjs

      - name: Scenario smoke
        run: node scripts/scenario-smoke.mjs

      # Retrieval + graph navigation are local, so the coach benchmark runs
      # offline in CI: it fails if recall collapses or paths stop resolving.
      - name: Coach benchmark (offline)
        run: pnpm eval:agent

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-baseline
          path: docs/eval/agent-baseline.md
          if-no-files-found: ignore

